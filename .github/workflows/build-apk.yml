name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-<not set>}"

          VERSION_LINE="$(java -version 2>&1 | head -n 1)"
          VERSION_RAW="$(echo "$VERSION_LINE" | sed -n 's/.*version "\([^"]*\)".*/\1/p')"
          if [ -z "$VERSION_RAW" ]; then
            echo "ERROR: Could not detect active Java version." >&2
            exit 1
          fi

          if [[ "$VERSION_RAW" == 1.* ]]; then
            JAVA_MAJOR="$(echo "$VERSION_RAW" | cut -d. -f2)"
          else
            JAVA_MAJOR="$(echo "$VERSION_RAW" | cut -d. -f1 | cut -d- -f1 | cut -d+ -f1)"
          fi

          if ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Could not parse active Java major version from '$VERSION_RAW'." >&2
            exit 1
          fi

          echo "Active Java major version: ${JAVA_MAJOR}"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java major version is ${JAVA_MAJOR}, but Java 17 or newer is required." >&2
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="./debug.keystore"

          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Existing ./debug.keystore found; skipping generation."
          else
            KEYTOOL_BIN="keytool"
            if [ -n "${JAVA_HOME:-}" ] && [ -x "${JAVA_HOME}/bin/keytool" ]; then
              KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            fi

            "$KEYTOOL_BIN" -genkeypair \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              >/dev/null 2>&1
          fi

          if [ ! -f "$KEYSTORE_PATH" ] || [ ! -s "$KEYSTORE_PATH" ]; then
            echo "ERROR: Failed to create ./debug.keystore." >&2
            exit 1
          fi
          echo "Confirmed ./debug.keystore is ready."

      - name: Build the debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -e "$EXPECTED_APK" ]; then
            echo "ERROR: Expected debug APK was not found at '$EXPECTED_APK'." >&2
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:" >&2
              find "app/build/outputs/apk" -type f -name "*.apk" >&2 || true
            else
              echo "Directory 'app/build/outputs/apk' does not exist." >&2
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: '$EXPECTED_APK' exists but is not a regular file." >&2
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: '$EXPECTED_APK' is empty." >&2
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "ERROR: '$EXPECTED_APK' does not have the .apk extension." >&2
            exit 1
          fi

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: APK path mismatch: '$EXPECTED_APK'." >&2
            exit 1
          fi

          echo "Verified debug APK at: $EXPECTED_APK"

      - name: Upload debug APK artifact
        id: upload_apk_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        shell: bash
        run: |
          set -euo pipefail
          VERIFIED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$VERIFIED_APK" ] || [ ! -s "$VERIFIED_APK" ] || [[ "$VERIFIED_APK" != *.apk ]]; then
            echo "ERROR: Verified debug APK is missing or invalid at '$VERIFIED_APK'." >&2
            exit 1
          fi

          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO_NAME="$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^[-._]+//; s/[-._]+$//')"
          if [ -z "$SANITIZED_REPO_NAME" ]; then
            SANITIZED_REPO_NAME="android-app"
          fi

          RELEASE_ASSET_NAME="${SANITIZED_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          RELEASE_TEMP_DIR="$(mktemp -d "${RUNNER_TEMP}/release-apk-asset.XXXXXX")"
          RELEASE_ASSET_PATH="${RELEASE_TEMP_DIR}/${RELEASE_ASSET_NAME}"

          cp "$VERIFIED_APK" "$RELEASE_ASSET_PATH"

          if [ ! -f "$RELEASE_ASSET_PATH" ] || [ ! -s "$RELEASE_ASSET_PATH" ] || [[ "$RELEASE_ASSET_PATH" != *.apk ]]; then
            echo "ERROR: Prepared release asset is missing or invalid at '$RELEASE_ASSET_PATH'." >&2
            exit 1
          fi

          {
            echo "asset_path=${RELEASE_ASSET_PATH}"
            echo "asset_name=${RELEASE_ASSET_NAME}"
          } >> "$GITHUB_OUTPUT"

          echo "Prepared release asset: ${RELEASE_ASSET_NAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSET_PATH: ${{ steps.prepare_release_asset.outputs.asset_path }}
        shell: bash
        run: |
          set -euo pipefail

          if ! gh --version; then
            echo "ERROR: GitHub CLI (gh) is not available." >&2
            exit 1
          fi

          if [ -z "${RELEASE_ASSET_PATH:-}" ] || [ ! -f "$RELEASE_ASSET_PATH" ] || [ ! -s "$RELEASE_ASSET_PATH" ] || [[ "$RELEASE_ASSET_PATH" != *.apk ]]; then
            echo "ERROR: Prepared release asset does not exist or is not a non-empty .apk file." >&2
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES="$(printf '%s\n' \
            "This is an automatically generated debug APK." \
            "" \
            "- Built by: GitHub Actions" \
            "- GitHub Actions Run Number: ${GITHUB_RUN_NUMBER}" \
            "- GitHub Actions Run Attempt: ${GITHUB_RUN_ATTEMPT}" \
            "- Source Commit SHA: ${GITHUB_SHA}" \
            "- Purpose: Intended for testing only." \
            "- Production Status: Not a Play Store production release." \
            "- Signing: Signed only with a temporary debug keystore.")"

          gh release create "$RELEASE_TAG" "$RELEASE_ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Report APK download result
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STEP_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          if [ "$RELEASE_STEP_OUTCOME" = "success" ]; then
            if RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url' 2>/dev/null)" && [ -n "$RELEASE_URL" ]; then
              echo "Release Tag: ${RELEASE_TAG}"
              echo "Release Title: ${RELEASE_TITLE}"
              echo "Direct GitHub Release Page URL: ${RELEASE_URL}"
              echo "APK Asset Filename: ${RELEASE_ASSET_NAME}"

              {
                echo "## Debug APK Release Published"
                echo ""
                echo "- **Release Title:** ${RELEASE_TITLE}"
                echo "- **Release Tag:** \`${RELEASE_TAG}\`"
                echo "- **APK Asset Filename:** \`${RELEASE_ASSET_NAME}\`"
                echo "- **GitHub Release URL:** ${RELEASE_URL}"
                echo ""
                echo "The debug APK can be downloaded directly from the **Assets** section on the GitHub Release page."
                echo "The normal GitHub Actions artifact (\`app-debug-apk\`) is also available as a backup."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          echo "::warning::GitHub Release publishing did not succeed for tag '${RELEASE_TAG}'. The debug APK build succeeded, and the GitHub Actions artifact named 'app-debug-apk' remains available for download."
          {
            echo "## Debug APK Build Summary (Release Publishing Warning)"
            echo ""
            echo "> **Warning:** GitHub Release publishing failed, but the debug APK build and artifact upload **succeeded**."
            echo ""
            echo "- **APK Build Status:** Succeeded"
            echo "- **Backup Download:** Download the debug APK from the GitHub Actions artifact named \`app-debug-apk\` on this workflow run."
          } >> "$GITHUB_STEP_SUMMARY"
